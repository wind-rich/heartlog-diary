<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>T6 回忆游乐园 · 逻辑自测</title>
    <style>
      body { font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; margin: 0; padding: 16px; background: #fffcf8; color: #2d2420; }
      ul { padding-left: 18px; }
      li.ok { color: #3f6b4a; }
      li.bad { color: #a3402f; }
      pre { background: #f6efe6; padding: 8px; border-radius: 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1 style="font-size: 15px">T6 回忆游乐园 · 逻辑自测</h1>
    <div id="out">运行中…</div>
    <script type="module">
      import {
        buildBoard,
        fmtDuration,
        gameEnabled,
        loadRecord,
        minMoves,
        pickPhotos,
        randomSeed,
        resolveMemoryPairCount,
        saveRecord,
        shuffleWithSeed,
        usablePhotos,
      } from '/src/viewer/game/memory.ts'
      import { enabledGameIds, hasEnabledGames, isGameEnabled } from '/src/viewer/game/config.ts'
      import { createPuzzleBoard, hintPuzzle, isPuzzleSolved, loadPuzzleRecord, savePuzzleRecord, swapPuzzlePieces } from '/src/viewer/game/puzzle.ts'
      import { buildGuessQuestions, distinctGuessPhotos, loadGuessRecord, saveGuessRecord } from '/src/viewer/game/photoGuess.ts'
      import { buildMemoryBoxQueue, relatedEntryForPhoto } from '/src/viewer/game/memoryBox.ts'
      import { buildTimelinePool, buildTimelinePuzzle, gradeTimeline, loadTimelineRecord, moveTimelineItem, saveTimelineRecord } from '/src/viewer/game/timeline.ts'
      import { buildQuizQuestions, loadQuizRecord, saveQuizRecord, validQuizItems } from '/src/viewer/game/quiz.ts'
      import { allDateCards, DATE_SCENE_PRESETS, DEFAULT_FILTERS, drawDateCombo, loadDateFavorites, saveDateFavorite } from '/src/viewer/game/dateDraw.ts'
      import { QUIZ_TEMPLATES, QUIZ_TEMPLATE_CATEGORIES } from '/src/lib/quizTemplates.ts'
      import { DATE_CARD_PACKS } from '/src/lib/dateCardPacks.ts'
      import { parseQuizSuggestions } from '/src/lib/quizRecommend.ts'

      const out = document.getElementById('out')
      const checks = []
      const lines = []
      function check(name, pass, detail = '') {
        checks.push({ name, pass, detail })
        lines.push(`<li class="${pass ? 'ok' : 'bad'}">${pass ? '✓' : '✗'} ${name}${detail ? ` — ${detail}` : ''}</li>`)
        out.innerHTML = `<ul>${lines.join('')}</ul>`
      }

      function photos(n) {
        return Array.from({ length: n }, (_, i) => ({
          id: `ph_${i + 1}`,
          personId: 'p_1',
          mime: 'image/jpeg',
          size: 100,
          takenAt: `2026-10-${String(i + 1).padStart(2, '0')}T10:00:00.000+08:00`,
          caption: `第 ${i + 1} 张`,
          tags: [],
          media: {
            thumb: { key: '', url: `data:image/jpeg;base64,AAAA${i}`, mime: 'image/jpeg', size: 10 },
            full: { key: '', url: `data:image/jpeg;base64,BBBB${i}`, mime: 'image/jpeg', size: 10 },
          },
        }))
      }
      const baseSections = { photos: true, stories: true, archive: true, wishes: true, health: true, music: false }

      try {
        check('开关：老快照没有字段 → 关闭', gameEnabled({ sections: baseSections }) === false, 'undefined')
        check('开关：显式 false → 关闭', gameEnabled({ sections: { ...baseSections, game: false } }) === false, 'false')
        check('开关：旧快照显式 true → 仅记忆配对', JSON.stringify(enabledGameIds({ sections: { ...baseSections, game: true } })) === '["memory"]', 'legacy memory')
        check('开关：config 缺失也不报错', gameEnabled(undefined) === false, 'undefined config')
        const newConfig = { sections: { ...baseSections, game: true }, games: { memory: { enabled: false }, puzzle: { enabled: true }, photoGuess: { enabled: false }, memoryBox: { enabled: true }, unknown: { enabled: true } } }
        check('子配置存在时按白名单显式开启', JSON.stringify(enabledGameIds(newConfig)) === '["puzzle","memoryBox"]', enabledGameIds(newConfig).join(','))
        check('新配置可关闭记忆配对', isGameEnabled(newConfig, 'memory') === false, 'memory=false')
        check('未知玩法被忽略', isGameEnabled(newConfig, 'unknown') === false, 'unknown ignored')
        check('总开关 false 时子配置不能绕过', enabledGameIds({ sections: { ...baseSections, game: false }, games: { puzzle: { enabled: true } } }).length === 0, 'total=false')
        check('所有子玩法关闭时大厅不显示', hasEnabledGames({ sections: { ...baseSections, game: true }, games: {} }) === false, 'games={}')

        const withEmpty = [...photos(3), { id: 'ph_bad', personId: 'p', mime: 'image/jpeg', size: 1, tags: [], media: { thumb: { key: '', url: '', mime: '', size: 0 }, full: { key: '', url: '', mime: '', size: 0 } } }]
        check('只用带缩略图的照片', usablePhotos(withEmpty).length === 3, `usable=${usablePhotos(withEmpty).length}`)
        const pool = photos(10)
        const a = pickPhotos(pool, 'pub_A', 6).map((p) => p.id)
        const b = pickPhotos(pool, 'pub_A', 6).map((p) => p.id)
        check('同一版本选出的照片固定', a.join(',') === b.join(','), a.join(','))
        check('选牌数量正确且不重复', a.length === 6 && new Set(a).size === 6, a.length + ' 张')
        const c = pickPhotos(pool, 'pub_B', 6).map((p) => p.id)
        check('换一版会换一批', c.join(',') !== a.join(','), `A=${a[0]} B=${c[0]}`)
        check('照片不足时按实际数量取', pickPhotos(photos(3), 'pub_A', 6).length === 3, '3 张')
        check('没有照片时返回空（不报错）', pickPhotos([], 'pub_A', 6).length === 0, '0 张')
        const seededSet = (seed) => pickPhotos(pool, 'pub_A', 6, seed).map((p) => p.id).sort().join(',')
        check('同一 seed 选出的照片一致', seededSet('s1') === seededSet('s1'), seededSet('s1'))
        check('不同 seed 选出不同的一组', seededSet('s1') !== seededSet('s2'), `s1=${seededSet('s1')} s2=${seededSet('s2')}`)
        const rs1 = randomSeed()
        const rs2 = randomSeed()
        check('randomSeed 每次不同且长度稳定', rs1 !== rs2 && rs1.length >= 8, `${rs1.slice(0, 8)} / ${rs2.slice(0, 8)}`)

        check('配对：挑战 8 对', resolveMemoryPairCount(8, 'challenge') === 8, '8')
        check('配对：7 张从挑战降为 6 对', resolveMemoryPairCount(7, 'challenge') === 6, '6')
        check('配对：4 张降为轻松 3 对', resolveMemoryPairCount(4, 'standard') === 3, '3')
        check('配对：少于 3 张不开局', resolveMemoryPairCount(2, 'easy') === null, 'null')
        const board = buildBoard(pool, 'pub_A', 'r0', 6)
        const counts = {}
        for (const c2 of board.cards) counts[c2.photoId] = (counts[c2.photoId] ?? 0) + 1
        check('牌数 = 对数 × 2', board.cards.length === 12 && board.pairCount === 6, `${board.cards.length} 张 / ${board.pairCount} 对`)
        check('每张照片正好出现两次', Object.values(counts).every((n) => n === 2), JSON.stringify(counts))
        check('每张牌 key 唯一', new Set(board.cards.map((c2) => c2.key)).size === 12, '12 个唯一 key')
        check('牌面带缩略图与无障碍文字', board.cards.every((c2) => c2.thumb && c2.label), board.cards[0].label)
        const board2 = buildBoard(pool, 'pub_A', 'r1', 6)
        check('重新开始换了顺序', board2.cards.map((c2) => c2.key).join(',') !== board.cards.map((c2) => c2.key).join(','), '顺序不同')
        check('最少步数等于对数', minMoves(6) === 6, '6')
        const s1 = shuffleWithSeed([1, 2, 3, 4, 5, 6, 7, 8], 'seed-1').join(',')
        const s2 = shuffleWithSeed([1, 2, 3, 4, 5, 6, 7, 8], 'seed-1').join(',')
        const s3 = shuffleWithSeed([1, 2, 3, 4, 5, 6, 7, 8], 'seed-2').join(',')
        check('同一 seed 洗牌顺序一致', s1 === s2, s1)
        check('不同 seed 顺序不同', s1 !== s3, `s1=${s1} s3=${s3}`)

        check('fmtDuration 格式化', fmtDuration(65_000) === '1:05' && fmtDuration(5_000) === '0:05', `${fmtDuration(65_000)} / ${fmtDuration(5_000)}`)
        localStorage.removeItem('heartlog.game.memory.v1.pub_A')
        localStorage.removeItem('heartlog.game.memory.v1.pub_B')
        localStorage.removeItem('heartlog.game.memory.v2.pub_A.standard.6')
        localStorage.removeItem('heartlog.game.memory.v2.pub_A.easy.3')
        check('没有成绩时返回 null', loadRecord('pub_A') === null, 'null')
        const first = saveRecord('pub_A', { moves: 10, ms: 30_000, at: '2026-10-26T10:00:00.000Z' })
        check('第一次通关记为旧版最佳', first.isBest && first.record.bestMoves === 10 && first.record.clears === 1, JSON.stringify(first.record))
        const better = saveRecord('pub_A', { moves: 8, ms: 40_000, at: '2026-10-26T10:10:00.000Z' })
        check('步数更少刷新旧版最佳', better.isBest && better.record.bestMoves === 8, JSON.stringify(better.record))
        saveRecord('pub_A', { moves: 6, ms: 20_000 }, 'standard', 6)
        saveRecord('pub_A', { moves: 3, ms: 10_000 }, 'easy', 3)
        check('新成绩按难度隔离', loadRecord('pub_A', 'standard', 6)?.bestMoves === 6 && loadRecord('pub_A', 'easy', 3)?.bestMoves === 3, 'standard/easy')
        check('旧版成绩没有被新难度覆盖', loadRecord('pub_A')?.bestMoves === 8 && loadRecord('pub_A')?.clears === 2, JSON.stringify(loadRecord('pub_A')))
        check('成绩按 publishId 隔离', loadRecord('pub_B') === null, 'pub_B null')
        localStorage.setItem('heartlog.game.memory.v1.pub_broken', '{"oops":1}')
        check('损坏的成绩被忽略而不是抛错', loadRecord('pub_broken') === null, 'null')

        const p1 = createPuzzleBoard(6, 'puzzle-seed')
        const p2 = createPuzzleBoard(6, 'puzzle-seed')
        check('拼图：同 seed 可复现', p1.join(',') === p2.join(','), p1.join(','))
        check('拼图：初始不是已完成', !isPuzzleSolved(p1), p1.join(','))
        check('拼图：不丢块且任意交换可还原', new Set(p1).size === 6 && isPuzzleSolved([0, 1, 2, 3, 4, 5]), '6 pieces')
        const swapped = swapPuzzlePieces([1, 0, 2], 0, 1)
        check('拼图：交换两块', swapped.join(',') === '0,1,2' && isPuzzleSolved(swapped), swapped.join(','))
        const hinted = hintPuzzle([1, 0, 2])
        check('拼图：提示至少纠正一块', hinted !== null && isPuzzleSolved(hinted.board), hinted ? hinted.board.join(',') : 'null')
        localStorage.removeItem('heartlog.game.puzzle.v1.pub_A.easy')
        const hintedScore = savePuzzleRecord('pub_A', 'easy', { moves: 4, ms: 1000, hints: 1 })
        const cleanScore = savePuzzleRecord('pub_A', 'easy', { moves: 5, ms: 2000, hints: 0 })
        check('拼图：提示局不进入无提示最佳', hintedScore.record.bestMoves === null && cleanScore.record.bestMoves === 5, JSON.stringify(cleanScore.record))
        check('拼图：损坏数据不崩', (localStorage.setItem('heartlog.game.puzzle.v1.pub_bad.easy', 'bad'), loadPuzzleRecord('pub_bad', 'easy') === null), 'null')

        const guessPool = photos(6)
        const dup = { ...guessPool[1], id: 'ph_dup' }
        const distinct = distinctGuessPhotos([...guessPool, dup])
        check('猜图：同媒体候选去重', distinct.length === 6 && !distinct.some((p) => p.id === 'ph_dup'), String(distinct.length))
        check('猜图：少于 4 张不开局', buildGuessQuestions(photos(3), 'pub_A', 'g1').length === 0, '0')
        const g1 = buildGuessQuestions(guessPool, 'pub_A', 'g1', 5)
        const g2 = buildGuessQuestions(guessPool, 'pub_A', 'g1', 5)
        check('猜图：同 seed 可复现', JSON.stringify(g1) === JSON.stringify(g2), `${g1.length} 题`)
        check('猜图：每题 4 个候选且答案存在', g1.length === 5 && g1.every((q) => q.optionIds.length === 4 && q.optionIds.includes(q.answerId)), `${g1.length} 题`)
        check('猜图：候选不重复', g1.every((q) => new Set(q.optionIds).size === 4), 'unique')
        localStorage.removeItem('heartlog.game.photoGuess.v1.pub_A.5')
        const guessRecord = saveGuessRecord('pub_A', 5, { correct: 4, assists: 2 })
        check('猜图：本机成绩按题量保存', guessRecord.bestCorrect === 4 && loadGuessRecord('pub_A', 5)?.clears === 1, JSON.stringify(guessRecord))

        const box1 = buildMemoryBoxQueue(guessPool, 'box-seed')
        const box2 = buildMemoryBoxQueue(guessPool, 'box-seed')
        check('盲盒：同 seed 队列可复现', box1.map((p) => p.id).join(',') === box2.map((p) => p.id).join(','), String(box1.length))
        check('盲盒：一轮不重复', new Set(box1.map((p) => p.id)).size === box1.length, String(box1.length))
        const entries = [{ id: 'entry_1', occurredAt: '2026-10-02T10:00:00.000+08:00', kind: 'daily', title: '第二张的记录', tags: [], photoIds: ['ph_2'], quick: false }]
        check('盲盒：可通过 entry.photoIds 反查关联', relatedEntryForPhoto(guessPool[1], entries)?.id === 'entry_1', 'entry_1')

        /* 8) 时光排序 */
        const timelineEntries = [
          { id: 'te_1', occurredAt: '2026-10-01T08:00:00.000+08:00', kind: 'daily', title: '第一天', tags: [], photoIds: [], quick: false },
          { id: 'te_2', occurredAt: '2026-10-02T09:00:00.000+08:00', kind: 'daily', title: '第二天', tags: [], photoIds: [], quick: false },
          { id: 'te_3', occurredAt: '2026-10-02T18:00:00.000+08:00', kind: 'daily', title: '同日不入选', tags: [], photoIds: [], quick: false },
          { id: 'te_4', occurredAt: '2026-10-04T10:00:00.000+08:00', kind: 'daily', title: '第四天', tags: [], photoIds: [], quick: false },
          { id: 'te_5', occurredAt: 'bad-date', kind: 'daily', title: '坏日期', tags: [], photoIds: [], quick: false },
        ]
        const timelinePool = buildTimelinePool(timelineEntries)
        check('时光排序：只用可信日期且同日去重', timelinePool.map((x) => x.entryId).join(',') === 'te_1,te_2,te_4', timelinePool.map((x) => x.entryId).join(','))
        const tl1 = buildTimelinePuzzle(timelineEntries, 'pub_A', 't1', 'easy')
        const tl2 = buildTimelinePuzzle(timelineEntries, 'pub_A', 't1', 'easy')
        check('时光排序：同 seed 可复现且不是正解开局', JSON.stringify(tl1) === JSON.stringify(tl2) && tl1 !== null && tl1.items.some((item, i) => item.entryId !== tl1.answer[i].entryId), `${tl1?.items.length} 条`)
        const moved = moveTimelineItem(['a', 'b', 'c'], 0, 1)
        check('时光排序：上移/下移按钮逻辑', moved.join(',') === 'b,a,c', moved.join(','))
        check('时光排序：逐位置判定', gradeTimeline(tl1.answer, tl1.answer.map((x) => x.entryId)).every(Boolean), 'all true')
        localStorage.removeItem('heartlog.game.timeline.v1.pub_A.easy')
        const tlRecord = saveTimelineRecord('pub_A', 'easy', { correct: 3, total: 3, ms: 12000 })
        check('时光排序：全对成绩按难度隔离', tlRecord.clears === 1 && loadTimelineRecord('pub_A', 'easy')?.plays === 1, JSON.stringify(tlRecord))

        /* 9) 五道题 */
        const quizContent = [
          { id: 'q1', kind: 'quiz', schemaVersion: 1, prompt: '第一题', options: [{ id: 'a', text: '对' }, { id: 'b', text: '错' }], correctOptionId: 'a', sourceEntryIds: ['entry_1'] },
          { id: 'q2', kind: 'quiz', schemaVersion: 1, prompt: '第二题', options: [{ id: 'a', text: 'A' }, { id: 'b', text: 'B' }, { id: 'c', text: 'C' }], correctOptionId: 'c', sourceEntryIds: [] },
          { id: 'q3', kind: 'quiz', schemaVersion: 1, prompt: '坏题：没有答案', options: [{ id: 'a', text: 'A' }], correctOptionId: 'missing', sourceEntryIds: [] },
        ]
        check('五道题：无效题目被过滤', validQuizItems(quizContent).length === 2, String(validQuizItems(quizContent).length))
        const quiz1 = buildQuizQuestions(quizContent, 'pub_A', 'q-seed')
        const quiz2 = buildQuizQuestions(quizContent, 'pub_A', 'q-seed')
        check('五道题：同 seed 可复现', JSON.stringify(quiz1) === JSON.stringify(quiz2), `${quiz1.length} 题`)
        check('五道题：答案 ID 不随选项洗牌变化', quiz1.every((q) => q.options.some((o) => o.id === q.correctOptionId)), quiz1.map((q) => q.correctOptionId).join(','))
        localStorage.removeItem('heartlog.game.quiz.v1.pub_A.2')
        const quizRecord = saveQuizRecord('pub_A', 2, { correct: 2, assists: 1 })
        check('五道题：本机成绩按题量隔离', quizRecord.bestCorrect === 2 && loadQuizRecord('pub_A', 2)?.rounds === 1, JSON.stringify(quizRecord))

        /* 10) 活动抽卡 */
        const dateCards = allDateCards([{ id: 'dc_custom', kind: 'dateCard', schemaVersion: 1, category: 'surprise', text: '互写一张小纸条', tags: ['setting:any', 'budget:free', 'duration:short'] }])
        check('活动抽卡：内置卡三类各至少 6 张', ['activity', 'place', 'surprise'].every((kind) => dateCards.filter((c) => c.category === kind).length >= 6), String(dateCards.length))
        check('活动抽卡：自定义卡合并且同 ID 不重复', dateCards.some((c) => c.id === 'dc_custom') && new Set(dateCards.map((c) => c.id)).size === dateCards.length, 'custom merged')
        const draw1 = drawDateCombo(dateCards, DEFAULT_FILTERS, {}, 'draw-seed')
        const draw2 = drawDateCombo(dateCards, DEFAULT_FILTERS, {}, 'draw-seed')
        check('活动抽卡：固定 seed 可复现', JSON.stringify(draw1.combo) === JSON.stringify(draw2.combo), Object.keys(draw1.combo).join(','))
        check('活动抽卡：一次组合三类齐全', Boolean(draw1.combo.activity && draw1.combo.place && draw1.combo.surprise), Object.keys(draw1.combo).join(','))
        const lockedDraw = drawDateCombo(dateCards, DEFAULT_FILTERS, { place: draw1.combo.place }, 'another-seed')
        check('活动抽卡：锁定项不会被重抽', lockedDraw.combo.place?.id === draw1.combo.place.id, lockedDraw.combo.place?.id || 'none')
        localStorage.removeItem('heartlog.game.dateDraw.v1.pub_A')
        const favorites = saveDateFavorite('pub_A', { activity: draw1.combo.activity, place: draw1.combo.place, surprise: draw1.combo.surprise }, '2026-10-27T00:00:00.000Z')
        check('活动抽卡：喜欢组合只存本机并可去重', favorites.length === 1 && loadDateFavorites('pub_A').length === 1, favorites[0]?.id || 'none')

        /* 11) 推荐内容 */
        check('题库模板：至少 20 条且分类完整', QUIZ_TEMPLATES.length >= 20 && QUIZ_TEMPLATE_CATEGORIES.every((c) => QUIZ_TEMPLATES.some((t) => t.category === c)), `${QUIZ_TEMPLATES.length} 条`)
        check('题库模板：每题至少两个候选且题干不重复', QUIZ_TEMPLATES.every((t) => t.options.length >= 2) && new Set(QUIZ_TEMPLATES.map((t) => t.prompt)).size === QUIZ_TEMPLATES.length, 'unique')
        const aiRaw = JSON.stringify({ questions: [
          { prompt: '记录里他做了什么？', options: ['做饭', '跑步', '睡觉'], correctIndex: 0, explanation: '记录里有', sourceEntryIds: ['e1', 'e_missing'] },
          { prompt: '坏题', options: ['只有一个'], correctIndex: 0, sourceEntryIds: ['e2'] },
          { prompt: '没有来源', options: ['A', 'B'], correctIndex: 0, sourceEntryIds: [] },
        ] })
        const parsedSuggestions = parseQuizSuggestions(aiRaw, [{ id: 'te_1', occurredAt: '2026-10-01', title: '做饭', content: '' }], 3)
        check('AI 题目：校验答案与来源白名单', parsedSuggestions.length === 1 && parsedSuggestions[0].sourceEntryIds.join(',') === 'te_1' && parsedSuggestions[0].correctIndex === 0, `${parsedSuggestions.length} 题`)
        check('推荐卡包：三套、每套六张、三类齐全', DATE_CARD_PACKS.length === 3 && DATE_CARD_PACKS.every((p) => p.cards.length === 6 && ['activity', 'place', 'surprise'].every((c) => p.cards.some((x) => x.category === c))), `${DATE_CARD_PACKS.length} 套`)
        check('场景推荐：至少六种且筛选值合法', DATE_SCENE_PRESETS.length >= 6 && DATE_SCENE_PRESETS.every((p) => ['any', 'indoor', 'outdoor'].includes(p.filters.setting) && ['any', 'short', 'half', 'day'].includes(p.filters.duration) && ['any', 'free', 'low', 'mid'].includes(p.filters.budget)), `${DATE_SCENE_PRESETS.length} 种`)

        const failed = checks.filter((c) => !c.pass)
        window.__gameselftest = { done: true, total: checks.length, failed: failed.length, checks }
        out.innerHTML = `<ul>${lines.join('')}</ul><pre>${failed.length ? `失败 ${failed.length} 项` : `全部通过（${checks.length} 项）`}</pre>`
      } catch (err) {
        window.__gameselftest = { done: true, fatal: String(err?.stack ?? err), checks }
        out.innerHTML = `<pre style="color:#a3402f">致命错误：${String(err?.message ?? err)}</pre>`
      }
    </script>
  </body>
</html>
