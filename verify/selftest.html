  <body>
    <h1>同步引擎自测（离线，使用内存模拟云端）</h1>
    <p>这个页面只在开发环境跑，不进生产构建。<strong>请用独立的浏览器配置打开</strong>，否则会用到你本机真实的 heartlog 数据库。</p>
    <div id="out">运行中…</div>
    <script type="module">
      import Dexie from 'dexie'
      import { db } from '/src/db/db.ts'
      import { wipeAllData } from '/src/lib/backup.ts'
      import { nowISO } from '/src/db/db.ts'
      import {
        runSync,
        pullFromCloud,
        pushLocalToCloud,
        resetSyncCursor,
        __setSyncCloudForTest,
        __setSyncSessionForTest,
      } from '/src/lib/sync.ts'
      import { resetPending } from '/src/lib/tombstones.ts'
      import { __snapshotToBackupDataForTest } from '/src/lib/publishedCopy.ts'
      import { cleanupConflicts, dismissConflict, restoreConflict } from '/src/lib/conflicts.ts'
      import {
        publishToCloud,
        previewPublish,
        rollbackToVersion,
        retractPublish,
        resumePublish,
        currentPublishState,
        __setPublishDbForTest,
        __skipPublishSessionForTest,
      } from '/src/lib/publish.ts'

      const out = document.getElementById('out')
      const checks = []
      const lines = []

      function check(name, pass, detail = '') {
        checks.push({ name, pass, detail })
        lines.push(`<li class="${pass ? 'ok' : 'bad'}">${pass ? '✓' : '✗'} ${name}${detail ? ` — ${detail}` : ''}</li>`)
        out.innerHTML = `<ul>${lines.join('')}</ul>`
      }
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms))

      /* ---------------- 内存版云端（database + storage） ---------------- */
      const remote = new Map() // entity:row_id → row
      const objects = new Map() // path → Blob

      async function runQuery(state) {
        let rows = [...remote.values()]
        if (state.eq) rows = rows.filter((r) => r[state.eq[0]] === state.eq[1])
        if (state.gt) rows = rows.filter((r) => String(r[state.gt[0]]) > String(state.gt[1]))
        rows.sort((a, b) => (a.updated_at < b.updated_at ? -1 : a.updated_at > b.updated_at ? 1 : 0))
        if (state.range) rows = rows.slice(state.range[0], state.range[1] + 1)
        if (state.limit) rows = rows.slice(0, state.limit)
        return { data: rows, error: null }
      }

      function builder(state = {}) {
        const api = {
          upsert: async (list) => {
            for (const r of list) remote.set(`${r.entity}:${r.row_id}`, { ...r })
            return { data: null, error: null }
          },
          select: () => builder(state),
          order: () => builder(state),
          limit: (n) => builder({ ...state, limit: n }),
          range: (from, to) => builder({ ...state, range: [from, to] }),
          gt: (col, v) => builder({ ...state, gt: [col, v] }),
          eq: (col, v) => builder({ ...state, eq: [col, v] }),
        }
        api.then = (res, rej) => runQuery(state).then(res, rej)
        return api
      }

      const mockDatabase = { from: () => builder() }

      const mockStorage = {
        userPath: (userId, rel) => `users/${userId}/${rel}`,
        exists: async (path) => ({ data: objects.has(path), error: null }),
        // 与真实服务一致：对象已存在时 upload 报错，upsert 选项并不保证生效
        upload: async (path, body) => {
          if (objects.has(path)) {
            return { data: null, error: { message: 'The resource already exists', code: 'STORAGE_KEY_ALREADY_EXISTS' } }
          }
          objects.set(path, body)
          return { data: { id: path, path, fullPath: path }, error: null }
        },
        update: async (path, body) => {
          if (!objects.has(path)) return { data: null, error: { message: '对象不存在', code: 'STORAGE_OBJECT_NOT_FOUND' } }
          objects.set(path, body)
          return { data: { id: path, path, fullPath: path }, error: null }
        },
        download: (path) => {
          const p = (async () => {
            const blob = objects.get(path)
            if (!blob) return { data: null, error: { message: `不存在：${path}` } }
            return { data: blob, error: null }
          })()
          p.asStream = async () => ({ data: null, error: { message: '不支持' } })
          return p
        },
      }

      /* ---------------- 造数据 ---------------- */
      const pngBytes = (seed) => new Uint8Array([137, 80, 78, 71, seed, seed, seed, seed])
      const mkBlob = (seed) => new Blob([pngBytes(seed)], { type: 'image/png' })
      const t0 = new Date(Date.now() - 86400000).toISOString()

      async function seed() {
        await db.persons.put({
          id: 'p_test',
          name: '自测人物',
          calendarType: 'solar',
          anniversaries: [],
          tags: [],
          isActive: true,
          createdAt: t0,
          updatedAt: t0,
        })
        await db.entries.put({
          id: 'e_keep',
          personId: 'p_test',
          occurredAt: t0,
          type: 'moment',
          title: '保留的记录',
          content: '这条不该被删',
          tagList: [],
          photoIds: ['ph_a'],
          followUpDone: false,
          quick: false,
          createdAt: t0,
          updatedAt: t0,
        })
        await db.entries.put({
          id: 'e_gone',
          personId: 'p_test',
          occurredAt: t0,
          type: 'moment',
          title: '将被删除的记录',
          tagList: [],
          photoIds: [],
          followUpDone: false,
          quick: false,
          createdAt: t0,
          updatedAt: t0,
        })
        for (const [id, seedNum] of [
          ['ph_a', 1],
          ['ph_b', 2],
        ]) {
          await db.photos.put({
            id,
            personId: 'p_test',
            blob: mkBlob(seedNum),
            thumb: mkBlob(seedNum + 10),
            mime: 'image/png',
            size: 8,
            tags: [],
            keepOriginal: true,
            createdAt: t0,
          })
        }
      }

      /** v1 的建表语句必须与应用历史版本一致，才能测到真实升级路径 */
      const V1_SCHEMA = {
        persons: 'id, name, isActive, createdAt, updatedAt',
        preferences: 'id, personId, category, direction, updatedAt',
        entries: 'id, personId, occurredAt, type, createdAt, updatedAt',
        dailyStatus: 'id, personId, date, updatedAt',
        health: 'id, personId, occurredAt, status, updatedAt',
        gifts: 'id, personId, givenAt, updatedAt',
        wishes: 'id, personId, status, raisedAt, updatedAt',
        photos: 'id, personId, entryId, giftId, takenAt, createdAt, *tags',
        insights: 'id, personId, dimension, confirmState, updatedAt',
        summaries: 'id, personId, kind, rangeStart, rangeEnd, createdAt',
        meta: 'key',
      }

      async function testUpgradeFromV1() {
        // 造一个 v1 老库（模拟用户已有的本机数据）
        const legacy = new Dexie('heartlog')
        legacy.version(1).stores(V1_SCHEMA)
        await legacy.open()
        await legacy.table('entries').put({
          id: 'e_legacy',
          personId: 'p_test',
          occurredAt: t0,
          type: 'moment',
          title: '老版本留下的记录',
          tagList: [],
          photoIds: [],
          followUpDone: false,
          quick: false,
          createdAt: t0,
          updatedAt: t0,
        })
        legacy.close()

        // 打开新版本：Dexie 会按版本增量迁移
        const kept = await db.entries.get('e_legacy')
        check('v1 老库升级后数据仍在', kept?.title === '老版本留下的记录', `title=${kept?.title ?? '缺失'}`)
        await db.tombstones.put({
          id: 'entries:e_probe',
          entity: 'entries',
          rowId: 'e_probe',
          deletedAt: nowISO(),
        })
        const probe = await db.tombstones.get('entries:e_probe')
        check('v1 老库升级后墓碑表可用', Boolean(probe), `probe=${Boolean(probe)}`)
        await db.tombstones.delete('entries:e_probe')
        await db.entries.delete('e_legacy')
      }

      /**
       * 发布用的模拟库：故意照真实表的约束校验。
       * 之前上线时媒体行漏了 publish_id（列是 NOT NULL），整批插入全失败却没人发现，
       * 这个 mock 就是为了让同类问题在自测阶段直接爆出来。
       */
      function makeStrictDb() {
        /* 四张表各一份内存副本：快照 / 媒体 / 版本历史 / 访问指针 */
        const tables = {
          heartlog_public_snapshot: new Map(), // owner_id → row
          heartlog_public_media: new Map(), // `${photo_id}:${kind}` → row
          heartlog_publish_history: new Map(), // publish_id → row
          heartlog_publish_state: new Map(), // owner_id → row
        }
        const calls = { media: 0, snapshot: 0, history: 0, state: 0 }
        // 故障注入：只允许前 N 次媒体写入成功，之后全部报错（用于验证部分失败中止）
        let failAfter = Infinity
        let mediaWrites = 0

        const rowsOf = (table) => [...(tables[table]?.values() ?? [])]

        const builder = (table, state = {}) => {
          const apply = (rows) => {
            let out = rows
            if (state.eq) out = out.filter((r) => r[state.eq[0]] === state.eq[1])
            if (state.limit) out = out.slice(0, state.limit)
            return out
          }
          const api = {
            upsert: async (row) => {
              const owner = row.owner_id || 'u_selftest'
              if (table === 'heartlog_public_media') {
                if (!row.publish_id) return { data: null, error: { message: 'null value in column "publish_id" violates not-null constraint' } }
                if (!row.data_b64) return { data: null, error: { message: 'null value in column "data_b64"' } }
                mediaWrites++
                if (mediaWrites > failAfter) {
                  return { data: null, error: { message: '模拟网关拒绝：媒体写入失败' } }
                }
                tables[table].set(`${row.photo_id}:${row.kind}`, { ...row, owner_id: owner })
                calls.media++
              } else if (table === 'heartlog_publish_history') {
                if (!row.publish_id) return { data: null, error: { message: 'history 缺少 publish_id' } }
                if (!row.payload) return { data: null, error: { message: 'history 缺少 payload' } }
                tables[table].set(row.publish_id, { ...row, owner_id: owner })
                calls.history++
              } else if (table === 'heartlog_publish_state') {
                if (!row.state) return { data: null, error: { message: 'state 缺少 state' } }
                tables[table].set(owner, { ...row, owner_id: owner })
                calls.state++
              } else {
                if (!row.publish_id) return { data: null, error: { message: 'snapshot 缺少 publish_id' } }
                tables[table].set(owner, { ...row, owner_id: owner })
                calls.snapshot++
              }
              return { data: null, error: null }
            },
            /** 回退时更新 last_activated_at 用 */
            update: (patch) => ({
              eq: async (col, v) => {
                for (const [key, r] of tables[table]) {
                  if (r[col] === v) tables[table].set(key, { ...r, ...patch })
                }
                return { data: null, error: null }
              },
              then: (res) => res({ data: null, error: null }),
            }),
            select: () => builder(table, state),
            limit: (n) => builder(table, { ...state, limit: n }),
            eq: (col, v) => builder(table, { ...state, eq: [col, v] }),
            order: () => builder(table, state),
          }
          api.then = (res) => res({ data: apply(rowsOf(table)), error: null })
          return api
        }

        return {
          db: { from: (t) => builder(t) },
          tables,
          snapshots: tables.heartlog_public_snapshot,
          media: tables.heartlog_public_media,
          history: tables.heartlog_publish_history,
          states: tables.heartlog_publish_state,
          calls,
          resetFailAfter: (n) => {
            failAfter = n
            mediaWrites = 0
          },
        }
      }

      /** 1×1 真 PNG：canvas 能解码，才能测到压缩与上传 */
      function realPng() {
        const b64 = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8DwHwAFAAH/q842iQAAAABJRU5ErkJggg=='
        const bin = atob(b64)
        const bytes = new Uint8Array(bin.length)
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i)
        return new Blob([bytes], { type: 'image/png' })
      }

      async function testPublish() {
        // 换成能解码的真实图片（前面造的假字节只用于同步测试）
        for (const id of ['ph_a', 'ph_b']) {
          const row = await db.photos.get(id)
          if (row) await db.photos.put({ ...row, blob: realPng(), thumb: realPng(), mime: 'image/png' })
        }

        const strict = makeStrictDb()
        __setPublishDbForTest(strict.db)
        __skipPublishSessionForTest(true)

        // T6 第三版：题库与自定义抽卡内容也应进入公开快照白名单
        const sourceEntry = (await db.entries.toArray())[0]
        const sourceEntry2 = (await db.entries.toArray())[1]
        const sourcePhoto = (await db.photos.toArray())[0]
        await db.gameContent.bulkPut([
          { id: 'gc_quiz_1', personId: 'p_test', kind: 'quiz', schemaVersion: 1, enabled: true, prompt: '他喜欢哪种天气？', options: [{ id: 'a', text: '晴天' }, { id: 'b', text: '雨天' }], correctOptionId: 'a', explanation: '测试说明', photoId: sourcePhoto.id, sourceEntryIds: [sourceEntry.id], createdAt: nowISO(), updatedAt: nowISO() },
          { id: 'gc_card_1', personId: 'p_test', kind: 'dateCard', schemaVersion: 1, enabled: true, category: 'surprise', text: '互写一张小纸条', tags: ['setting:any', 'budget:free', 'duration:short'], createdAt: nowISO(), updatedAt: nowISO() },
          { id: 'gc_treasure_1', personId: 'p_test', kind: 'treasure', schemaVersion: 1, enabled: true, title: '发布寻宝测试', description: '三步都要能走通', steps: [
            { id: 'ts1', clue: '第一条线索', targetType: 'entry', targetId: sourceEntry.id },
            { id: 'ts2', clue: '第二条线索', targetType: 'entry', targetId: sourceEntry2.id },
            { id: 'ts3', clue: '第三条线索', targetType: 'photo', targetId: sourcePhoto.id },
          ], completionMessage: '三颗星都找到了', createdAt: nowISO(), updatedAt: nowISO() },
        ])

        // 复用前面造的数据：1 人物 / 1 记录（e_gone 已删） / 2 张照片
        const r1 = await publishToCloud()
        check('发布：写入 4 格媒体（2 张 × 缩略图/网页图）', strict.media.size === 4, `media=${strict.media.size}`)
        check('发布：媒体行带 publish_id（NOT NULL 约束）', [...strict.media.values()].every((r) => !!r.publish_id), '缺 publish_id 会被 mock 拒绝')
        check('发布：写入一条快照', strict.snapshots.size === 1, `snapshots=${strict.snapshots.size}`)
        // 此时本机有 2 条记录（前面「只上传不复活」那步又把 e_gone 放回了本机）
        check('发布：统计与内容一致', r1.photos === 2 && r1.entries === 2, `photos=${r1.photos} entries=${r1.entries}`)
        check('发布：无照片错误', r1.errors.length === 0, r1.errors.join(' | '))

        const snapRow = [...strict.snapshots.values()][0]
        const payloadPhotos = snapRow.payload.photos || []
        check('发布：payload 里的照片不带媒体地址', payloadPhotos.every((p) => p.media.thumb.url === '' && p.media.full.url === ''))
        check('发布：payload 里照片数与统计一致', payloadPhotos.length === 2, `photos=${payloadPhotos.length}`)
        const gameItems = snapRow.payload.gameContent || []
        check('发布：gameContent 白名单进入快照', gameItems.length === 3 && gameItems.some((x) => x.kind === 'quiz') && gameItems.some((x) => x.kind === 'dateCard') && gameItems.some((x) => x.kind === 'treasure'), JSON.stringify(gameItems.map((x) => x.kind)))
        check('发布：gameContent 不透传内部字段', gameItems.every((x) => x.personId === undefined && x.createdAt === undefined && x.updatedAt === undefined && x.enabled === undefined), '仅公开字段')
        check('发布：gameContent 计数与内容一致', snapRow.payload.manifest.counts.gameContent === 3, `counts=${snapRow.payload.manifest.counts.gameContent}`)

        let invalidBlocked = null
        await db.gameContent.put({ id: 'gc_bad', personId: 'p_test', kind: 'quiz', schemaVersion: 1, enabled: true, prompt: '', options: [], correctOptionId: 'missing', sourceEntryIds: ['missing'], createdAt: nowISO(), updatedAt: nowISO() })
        try { await publishToCloud() } catch (e) { invalidBlocked = e }
        check('发布：无效互动内容会中止发布', Boolean(invalidBlocked) && String(invalidBlocked?.message || '').includes('互动内容'), String(invalidBlocked?.message || '').slice(0, 80))
        await db.gameContent.delete('gc_bad')
        // 这条只是「发布校验」探针，不是同步删除场景；清掉墓碑避免污染后续同步断言
        await db.tombstones.delete('gameContent:gc_bad')

        const sourcePhoto2 = (await db.photos.toArray())[1]
        await db.gameContent.put({ id: 'gc_treasure_2', personId: 'p_test', kind: 'treasure', schemaVersion: 1, enabled: true, title: '第二个寻宝', steps: [
          { id: 'a1', clue: 'A1', targetType: 'entry', targetId: sourceEntry.id },
          { id: 'a2', clue: 'A2', targetType: 'entry', targetId: sourceEntry2.id },
          { id: 'a3', clue: 'A3', targetType: 'photo', targetId: sourcePhoto2.id },
        ], completionMessage: '完成', createdAt: nowISO(), updatedAt: nowISO() })
        let multiBlocked = null
        try { await publishToCloud() } catch (e) { multiBlocked = e }
        check('发布：同一版本多个寻宝会中止', Boolean(multiBlocked) && String(multiBlocked?.message || '').includes('只能启用 1 个寻宝'), String(multiBlocked?.message || '').slice(0, 80))
        await db.gameContent.delete('gc_treasure_2')
        await db.tombstones.delete('gameContent:gc_treasure_2')

        // 再发一次：内容没变，应当全部跳过、不再上传
        const before = strict.calls.media
        const r2 = await publishToCloud()
        check('重复发布：不重传未变的照片', strict.calls.media === before && r2.photosUploaded === 0, `新增上传 ${strict.calls.media - before} 次`)
        check('重复发布：跳过计数正确', r2.photosSkipped === 4, `skipped=${r2.photosSkipped}`)

        /* ---- T4：版本历史 / 预览差异 / 回退 / 撤回 ---- */
        // r1 与 r2 已各写一条历史，这里用相对计数，避免把「几次发布」写死
        const history0 = strict.history.size
        check('发布：每次发布留一条版本历史', history0 === 2, `history=${history0}`)
        const histRow = [...strict.history.values()][0]
        check(
          '发布：历史 payload 与线上内容一致',
          Boolean(histRow) && histRow.payload?.entries?.length === snapRow.payload.entries.length,
          `history.entries=${histRow?.payload?.entries?.length} live.entries=${snapRow.payload.entries.length}`,
        )
        check('发布：访问指针置为 live', strict.states.get('u_selftest')?.state === 'live', `state=${strict.states.get('u_selftest')?.state}`)

        const p0 = await previewPublish()
        check('预览：内容未变时不报「有变化」', p0.hasChanges === false, p0.lines.join(' | ') || '无差异行')

        const someEntry = (await db.entries.toArray())[0]
        const originalTitle = someEntry.title
        await db.entries.update(someEntry.id, { title: '改过的标题', updatedAt: nowISO() })
        const gameRow = await db.gameContent.get('gc_quiz_1')
        await db.gameContent.put({ ...gameRow, prompt: '他喜欢哪种天气？（改过）', updatedAt: nowISO() })
        const p1 = await previewPublish()
        check(
          '预览：改动一条记录 → 记录「改 1」',
          p1.diff.entries?.changed === 1 && p1.lines.some((l) => l.startsWith('记录')),
          JSON.stringify(p1.diff.entries),
        )
        check('预览：玩法内容进入差异预览', p1.diff.gameContent?.changed === 1 && p1.lines.some((l) => l.startsWith('玩法内容')), JSON.stringify(p1.diff.gameContent))

        await publishToCloud()
        check('再发布：版本历史累加一条', strict.history.size === history0 + 1, `history=${strict.history.size}`)

        const firstPublishId = histRow.publish_id
        const rb = await rollbackToVersion(firstPublishId)
        const liveRow = [...strict.snapshots.values()][0]
        check('回退：线上快照指回旧版本', liveRow.publish_id === firstPublishId && liveRow.is_live === true, `${liveRow.publish_id} live=${liveRow.is_live}`)
        check(
          '回退：内容恢复为旧标题',
          liveRow.payload.entries.find((e) => e.id === someEntry.id)?.title === originalTitle,
          `title=${liveRow.payload.entries.find((e) => e.id === someEntry.id)?.title}`,
        )
        check('回退：返回的条数与旧版本一致', rb.photos === liveRow.payload.photos.length, `photos=${rb.photos}`)
        check('回退：访问指针仍为 live', strict.states.get('u_selftest')?.state === 'live')

        // 防线：旧版本引用的图缺失时必须中止，不能把「记录回来了、图全破」的版本推上线
        const lostPhoto = liveRow.payload.photos[0].id
        const savedThumb = strict.media.get(`${lostPhoto}:thumb`)
        strict.media.delete(`${lostPhoto}:thumb`)
        let rbErr = null
        try {
          await rollbackToVersion([...strict.history.keys()][0])
        } catch (e) {
          rbErr = e
        }
        check('回退：旧版本缺图时中止（避免公网页破图）', Boolean(rbErr), rbErr ? String(rbErr.message).slice(0, 70) : '未抛出')
        if (savedThumb) strict.media.set(`${lostPhoto}:thumb`, savedThumb)

        await retractPublish('暂停一下')
        const st1 = await currentPublishState()
        const snapAfterRetract = [...strict.snapshots.values()][0]
        check('撤回：访问指针变成 retracted', st1.state === 'retracted', `state=${st1.state}`)
        check('撤回：快照下线（is_live=false）', snapAfterRetract.is_live === false, `is_live=${snapAfterRetract.is_live}`)
        check('撤回：说明文字一并写入', st1.note === '暂停一下', `note=${st1.note}`)

        await resumePublish()
        const st2 = await currentPublishState()
        check(
          '重新上线：指针恢复 live 且快照重新可见',
          st2.state === 'live' && [...strict.snapshots.values()][0].is_live === true,
          `state=${st2.state}`,
        )

        /**
         * 还原被改过的那条记录。
         *
         * 不加这一步，后面「拉取后游标前进」会失败：本步把 updatedAt 写成了「现在」，
         * 下一次同步会把它推到模拟云端，游标于是跳到今天而不是测试基准时间。
         * 测试之间必须互不污染，否则失败原因会指向错误的地方。
         */
        await db.entries.put(someEntry)

        /* 关键回归：部分照片失败时必须中止，不能发布出「记录新、图缺」的快照。
           旧实现只在「全部失败」时才中止，3/4 失败照样写快照，公网页会破图。

           注意：必须先清空上一轮已写入的媒体，否则指纹比对会全部命中、
           根本不发起上传，故障注入就成了空转（这个坑实测踩过）。 */
        strict.media.clear()
        strict.resetFailAfter(1) // 只让第 1 格成功，其余全失败
        strict.snapshots.clear()
        const snapCountBefore = strict.calls.snapshot
        let partialErr = null
        try {
          await publishToCloud()
        } catch (e) {
          partialErr = e
        }
        check(
          '部分照片失败时中止发布（不写快照）',
          Boolean(partialErr) && strict.calls.snapshot === snapCountBefore && strict.snapshots.size === 0,
          partialErr ? `抛出：${String(partialErr.message).slice(0, 80)}` : `未抛出错误（媒体 ${strict.media.size} 格）`,
        )
        check(
          '中止后没有留下快照（公网页仍是上一版）',
          strict.snapshots.size === 0,
          `snapshots=${strict.snapshots.size}`,
        )
        strict.resetFailAfter(Infinity)

        __setPublishDbForTest(null)
        __skipPublishSessionForTest(false)
      }

      /**
       * 冲突副本的取回与清理（R-008 收尾）。
       * 放在最后执行：取回会把 updatedAt 写成「现在」，若在同步用例之前跑，
       * 会把模拟云端的游标推到今天，让无关断言失败。
       */
      async function testConflictRestore() {
        const person = (await db.persons.toArray())[0]
        const base = { personId: person?.id ?? 'p_x', category: 'food', direction: 'like', evidenceEntryIds: [], createdAt: t0 }
        await db.preferences.put({ ...base, id: 'pr_conf', name: '云端赢的版本', updatedAt: t0 })
        const cid = `preferences:pr_conf:${t0}`
        await db.conflicts.put({
          id: cid,
          entity: 'preferences',
          rowId: 'pr_conf',
          discardedUpdatedAt: t0,
          keptUpdatedAt: new Date(Date.parse(t0) + 1000).toISOString(),
          detectedAt: t0,
          payload: { ...base, id: 'pr_conf', name: '被覆盖的版本', updatedAt: t0 },
        })

        const res = await restoreConflict(await db.conflicts.get(cid))
        const after = await db.preferences.get('pr_conf')
        check('冲突取回：把被覆盖的版本写回本机', res.ok && after?.name === '被覆盖的版本', after?.name ?? res.message)
        check(
          '冲突取回：时间戳改成现在（下一轮同步才能推上去）',
          Boolean(after) && Date.parse(after.updatedAt) > Date.parse(t0),
          after?.updatedAt,
        )
        const restored = await db.conflicts.get(cid)
        check('冲突取回：副本标记为已处理', Boolean(restored?.dismissedAt && restored?.resolvedAt), `dismissed=${Boolean(restored?.dismissedAt)}`)

        const photoRes = await restoreConflict({
          id: 'photos:ph_x:1',
          entity: 'photos',
          rowId: 'ph_x',
          discardedUpdatedAt: t0,
          keptUpdatedAt: t0,
          detectedAt: t0,
          payload: { id: 'ph_x' },
        })
        check('冲突取回：照片不给取回（没有二进制，写回会指向不存在的图）', photoRes.ok === false, photoRes.message)

        const old = new Date(Date.now() - 120 * 86_400_000).toISOString()
        await db.conflicts.put({
          id: 'c_old',
          entity: 'entries',
          rowId: 'e_old',
          discardedUpdatedAt: old,
          keptUpdatedAt: old,
          detectedAt: old,
          payload: { id: 'e_old' },
          dismissedAt: old,
        })
        await db.conflicts.put({
          id: 'c_pending',
          entity: 'entries',
          rowId: 'e_new',
          discardedUpdatedAt: t0,
          keptUpdatedAt: t0,
          detectedAt: t0,
          payload: { id: 'e_new' },
        })
        await dismissConflict(cid)

        const removed = await cleanupConflicts()
        const keptOld = await db.conflicts.get('c_old')
        const keptPending = await db.conflicts.get('c_pending')
        check(
          '冲突清理：只删「已处理且超过保留期」的，未处理的绝不动',
          removed === 1 && !keptOld && Boolean(keptPending),
          `removed=${removed} old=${Boolean(keptOld)} pending=${Boolean(keptPending)}`,
        )
      }

        // 10.9) 回归：游标落在未来时必须自愈
        //       旧版本用本机 now 兜底推进游标，时钟快的设备会把游标写到未来，
        //       之后云端所有真实写入都小于它 —— 永远拉不到，点同步也没用。
        const futureCursor = new Date(Date.now() + 6 * 3600_000).toISOString()
        await new Promise((res) => {
          const tx = db.meta.put({ key: 'cloudSyncCursor', value: futureCursor })
          tx.then(() => res()).catch(() => res())
        })
        const healTime = new Date(Date.now() - 60_000).toISOString()
        remote.set('preferences:pr_after_future', {
          entity: 'preferences',
          row_id: 'pr_after_future',
          person_id: 'p_test',
          updated_at: healTime,
          deleted: false,
          payload: {
            id: 'pr_after_future',
            personId: 'p_test',
            category: 'test',
            name: '超前游标之后仍应可见',
            direction: 'like',
            tags: [],
            evidenceEntryIds: [],
            createdAt: healTime,
            updatedAt: healTime,
          },
        })
        const rHeal = await pullFromCloud()
        const healed = await db.preferences.get('pr_after_future')
        check(
          '超前游标自动失效并重新拉取',
          healed?.name === '超前游标之后仍应可见',
          `name=${healed?.name ?? '缺失'} pulled=${rHeal.pulled}`,
        )
        check(
          '自愈后游标不再是未来时间',
          Date.parse((await db.meta.get('cloudSyncCursor'))?.value || '1970-01-01') < Date.now() + 120_000,
          `cursor=${(await db.meta.get('cloudSyncCursor'))?.value}`,
        )
        await db.preferences.delete('pr_after_future')

        // 10.95) 回归：游标已越过某行时，该行仍必须被拉到（真实故障）
        //        场景：手机新建偏好 → 云端 09:47:44 → 电脑游标因旧版本被推到更晚，
        //        之后 gt(cursor) 永远过滤掉这行，电脑「点多少次同步都没有」。
        //        这不是未来游标，healFutureCursor 救不了，只能靠全量比对。
        const pastCursor = new Date(Date.now() - 24 * 3600_000).toISOString()
        await new Promise((res) => {
          db.meta.put({ key: 'cloudSyncCursor', value: new Date().toISOString() }).then(() => res()).catch(() => res())
        })
        // 云端这行的时间早于「当前游标」，旧实现会被 gt 过滤掉
        remote.set('preferences:pr_behind_now', {
          entity: 'preferences',
          row_id: 'pr_behind_now',
          person_id: 'p_test',
          updated_at: pastCursor,
          deleted: false,
          payload: {
            id: 'pr_behind_now',
            personId: 'p_test',
            category: 'test',
            name: '游标已越过的行也必须同步',
            direction: 'like',
            tags: [],
            evidenceEntryIds: [],
            createdAt: pastCursor,
            updatedAt: pastCursor,
          },
        })
        const rBehind = await pullFromCloud()
        const behindRow = await db.preferences.get('pr_behind_now')
        check(
          '游标已越过的行仍能拉到本机（全量比对）',
          behindRow?.name === '游标已越过的行也必须同步',
          `name=${behindRow?.name ?? '缺失'} pulled=${rBehind.pulled}`,
        )
        await db.preferences.delete('pr_behind_now')
        remote.delete('preferences:pr_behind_now')

        // 10.96) 回归：冲突时必须留下被覆盖版本副本
        //        旧行为是「较新者胜」静默丢弃较早那次修改，用户事后只会发现
        //        「我明明改过，怎么变回去了」。现在覆盖前先存一份到 conflicts 表。
        const conflictBase = new Date(Date.now() - 30_000).toISOString()
        // 本机：比云端旧，但内容与云端不同（两端都改过）
        await db.preferences.put({
          id: 'pr_conflict',
          personId: 'p_test',
          category: 'test',
          name: '本机改过的版本',
          direction: 'like',
          tags: [],
          evidenceEntryIds: [],
          createdAt: conflictBase,
          updatedAt: conflictBase,
        })
        const remoteNewerTime = new Date(Date.parse(conflictBase) + 60_000).toISOString()
        remote.set('preferences:pr_conflict', {
          entity: 'preferences',
          row_id: 'pr_conflict',
          person_id: 'p_test',
          updated_at: remoteNewerTime,
          deleted: false,
          payload: {
            id: 'pr_conflict',
            personId: 'p_test',
            category: 'test',
            name: '云端更新过的版本',
            direction: 'like',
            tags: [],
            evidenceEntryIds: [],
            createdAt: conflictBase,
            updatedAt: remoteNewerTime,
          },
        })
        const beforeConflicts = await db.conflicts.count()
        const rConflict = await pullFromCloud()
        const conflictRows = await db.conflicts.toArray()
        const myConflict = conflictRows.find((c) => c.rowId === 'pr_conflict' && c.entity === 'preferences')
        check(
          '冲突时保留被覆盖版本',
          Boolean(myConflict) && myConflict.payload?.name === '本机改过的版本',
          myConflict ? `name=${myConflict.payload?.name}` : `conflicts=${conflictRows.length}`,
        )
        check(
          '冲突被计入 conflicts 统计',
          (rConflict.conflicts ?? 0) >= 1,
          `conflicts=${rConflict.conflicts} 新增副本=${conflictRows.length - beforeConflicts}`,
        )
        check(
          '云端更新的版本仍获胜（合并规则不变）',
          (await db.preferences.get('pr_conflict'))?.name === '云端更新过的版本',
          `local=${(await db.preferences.get('pr_conflict'))?.name}`,
        )

        // 内容完全相同时不该记冲突（只时间戳不同），避免冲突表被噪音塞满
        await db.preferences.put({
          id: 'pr_no_conflict',
          personId: 'p_test',
          category: 'test',
          name: '内容相同',
          direction: 'like',
          tags: [],
          evidenceEntryIds: [],
          createdAt: conflictBase,
          updatedAt: conflictBase,
        })
        const sameNewer = new Date(Date.parse(conflictBase) + 120_000).toISOString()
        remote.set('preferences:pr_no_conflict', {
          entity: 'preferences',
          row_id: 'pr_no_conflict',
          person_id: 'p_test',
          updated_at: sameNewer,
          deleted: false,
          payload: {
            id: 'pr_no_conflict',
            personId: 'p_test',
            category: 'test',
            name: '内容相同',
            direction: 'like',
            tags: [],
            evidenceEntryIds: [],
            createdAt: conflictBase,
            updatedAt: sameNewer,
          },
        })
        await pullFromCloud()
        const noisy = (await db.conflicts.toArray()).filter((c) => c.rowId === 'pr_no_conflict')
        check('内容相同不记冲突（只有时间戳变化）', noisy.length === 0, `误记 ${noisy.length} 条`)

        await db.preferences.delete('pr_conflict')
        await db.preferences.delete('pr_no_conflict')
        remote.delete('preferences:pr_conflict')
        remote.delete('preferences:pr_no_conflict')

        // 11) 回归：从已发布快照建副本，时间戳不得晚于发布时刻
        //     真实故障：电脑用「一键导入」建副本时把缺失时间填成导入那一刻，
        //     副本比手机上的真实修改「更新」，于是电脑一上传就把手机改的档案覆盖掉了。
        const PUBLISHED_AT = '2026-10-26T02:26:00.000+08:00'
        const fakeSnapshot = {
          manifest: { formatVersion: 1, siteId: 't', publishId: 'pub_test', publishedAt: PUBLISHED_AT, counts: {}, contentHash: '' },
          config: { centerPersonId: 'p_snap', tagline: '', theme: 'warm-light', sections: {} },
          person: { id: 'p_snap', displayName: '快照人物', calendarType: 'solar', tags: [] },
          anniversaries: [],
          entries: [
            {
              id: 'e_snap',
              occurredAt: '2026-10-20T10:00:00.000+08:00',
              kind: 'daily',
              title: '快照里的记录',
              tags: [],
              photoIds: [],
              quick: false,
            },
          ],
          photos: [],
          // 这条偏好没有任何时间字段，正是旧实现填「导入时刻」的地方
          preferences: [
            { id: 'pr_snap', category: 'food', name: '快照里的偏好', direction: 'like', tags: [], evidenceEntryIds: [] },
          ],
          wishes: [],
          gifts: [],
          health: [],
          insights: [{ id: 'i_snap', dimension: '兴趣', description: '快照里的画像', evidenceType: 'stated', evidenceEntryIds: [], confirmState: 'confirmed' }],
          summaries: [],
          statuses: [],
        }
        const importedData = __snapshotToBackupDataForTest(fakeSnapshot)
        const publishedMs = Date.parse(PUBLISHED_AT)
        const noFuture = [
          ...importedData.persons.map((r) => ['persons', r.id, r.updatedAt]),
          ...importedData.entries.map((r) => ['entries', r.id, r.updatedAt]),
          ...importedData.preferences.map((r) => ['preferences', r.id, r.updatedAt]),
          ...importedData.insights.map((r) => ['insights', r.id, r.updatedAt]),
        ].filter(([, , at]) => Date.parse(at) > publishedMs)
        check(
          '导入副本的时间戳不晚于发布时刻',
          noFuture.length === 0,
          noFuture.length ? noFuture.map(([e, id, at]) => `${e}:${id}@${at}`).join(' | ') : `基准=${PUBLISHED_AT}`,
        )
        check(
          '无时间字段的条目回退到发布时刻（不是导入时刻）',
          Date.parse(importedData.preferences[0]?.updatedAt || '') === publishedMs,
          `preference.updatedAt=${importedData.preferences[0]?.updatedAt}`,
        )
        check(
          '带时间的条目仍用自身业务时间',
          Date.parse(importedData.entries[0]?.occurredAt || '') === Date.parse('2026-10-20T10:00:00.000+08:00'),
          `entry.occurredAt=${importedData.entries[0]?.occurredAt}`,
        )

        // 12) T6 第三版：互动内容进入主同步，删除也走墓碑上行
        await db.gameContent.put({
          id: 'gc_sync_probe', personId: 'p_snap', kind: 'dateCard', schemaVersion: 1, enabled: true,
          category: 'surprise', text: '同步测试卡片', tags: ['setting:any'], createdAt: nowISO(), updatedAt: nowISO(),
        })
        await runSync()
        check('互动内容同步上行', remote.get('gameContent:gc_sync_probe')?.payload?.text === '同步测试卡片', JSON.stringify(remote.get('gameContent:gc_sync_probe')?.payload || {}))
        await db.gameContent.delete('gc_sync_probe')
        await sleep(80)
        await runSync()
        check('互动内容删除同步为墓碑行', remote.get('gameContent:gc_sync_probe')?.deleted === true, JSON.stringify(remote.get('gameContent:gc_sync_probe')?.deleted))

        // 13) 收尾
        __setSyncCloudForTest(null)
        __setSyncSessionForTest(undefined)
        await wipeAllData()
        await db.tombstones.clear()

        await testConflictRestore()

        const failed = checks.filter((c) => !c.pass)
        window.__selftest = { done: true, total: checks.length, failed: failed.length, checks }
        out.innerHTML = `<ul>${lines.join('')}</ul><pre>${failed.length ? '失败 ' + failed.length + ' 项' : '全部通过（' + checks.length + ' 项）'}</pre>`
      }

      main().catch((err) => {
        window.__selftest = { done: true, fatal: String(err && err.stack ? err.stack : err), checks }
        out.innerHTML = `<ul>${lines.join('')}</ul><pre class="bad">致命错误：${String(err && err.message ? err.message : err)}</pre>`
      })
    </script>
  </body>
</html>
